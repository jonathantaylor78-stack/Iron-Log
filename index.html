<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161A">
<title>Iron Log</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #14161A; color: #E8E6DF; font-family: system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; }
  .app { max-width: 560px; margin: 0 auto; padding: 16px 12px 150px; }
  .title { font-size: 30px; font-weight: 800; letter-spacing: .14em; }
  .subtitle { font-size: 14px; color: #8A919C; margin-top: 2px; }
  .row { display: flex; gap: 6px; margin-top: 14px; }
  .phase { flex: 1; padding: 12px 0; background: #1C2027; color: #8A919C; border: 1px solid #2A2F38; border-radius: 8px; font-size: 16px; font-weight: 700; }
  .phase.on { background: #F5A623; color: #14161A; border-color: #F5A623; }
  .phasesub { font-size: 14px; color: #8A919C; margin: 8px 2px 12px; }
  .days { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; }
  .day { flex: 1 0 auto; min-width: 74px; padding: 9px 9px; background: #1C2027; border: 1px solid #2A2F38; border-radius: 8px; color: #8A919C; text-align: center; }
  .day.on { border-color: #F5A623; color: #E8E6DF; }
  .day b { display: block; font-size: 14px; font-family: ui-monospace, Menlo, monospace; }
  .day span { font-size: 12.5px; }
  .titlerow { display: flex; align-items: center; justify-content: space-between; margin: 14px 2px 10px; gap: 10px; }
  h2 { font-size: 22px; margin: 0; }
  .editToggle { flex: 0 0 auto; padding: 8px 12px; background: transparent; border: 1px solid #2A2F38; border-radius: 8px; color: #A8B0BB; font-size: 14px; font-weight: 700; }
  .editToggle.on { border-color: #F5A623; color: #F5A623; }
  .card { background: #1C2027; border: 1px solid #2A2F38; border-radius: 12px; padding: 14px 12px 16px; margin-bottom: 12px; }
  .exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .exname { font-size: 19px; font-weight: 700; }
  .scheme { font-size: 15px; color: #F5A623; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
  .resttag { font-size: 14px; color: #6E7580; margin-top: 3px; }
  .last { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; font-size: 16px; margin: 7px 0 4px; }
  .last:last-of-type { margin-bottom: 9px; }
  .beat { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #14161A; background: #F5A623; border-radius: 4px; padding: 1px 5px; }
  .today { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: #14161A; background: #3FDD8C; border-radius: 4px; padding: 1px 5px; }
  .sugchip { font-size: 12.5px; font-weight: 800; border-radius: 4px; padding: 2px 7px; }
  .sugchip.up { color: #14161A; background: #F5A623; }
  .sugchip.hold { color: #C9A25A; border: 1px solid #4A3F26; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .dim { color: #6E7580; }
  .warmnote { color: #B98C4A; font-size: 14px; }
  .pr { color: #3FDD8C; font-weight: 800; font-size: 14px; }
  .setrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .setrow.warm input { background: #1A1712; border-color: #3A3020; }
  .setnum { width: 22px; font-size: 15px; color: #6E7580; font-family: ui-monospace, Menlo, monospace; text-align: right; }
  .setnum.wlab { color: #F5A623; font-weight: 800; }
  input, textarea, select { background: #14161A; border: 1px solid #2A2F38; border-radius: 8px; color: #E8E6DF; padding: 12px 8px; font-size: 21px; font-weight: 600; }
  .setrow input { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, monospace; text-align: center; }
  .setrow input.sugg { color: #F5A623; border-color: #4A3F26; }
  .setrest { flex: 0 0 auto; width: 42px; padding: 12px 0; background: transparent; border: 1px solid #2A3A46; border-radius: 8px; color: #6FB3D2; font-size: 18px; line-height: 1; }
  .setdel { flex: 0 0 auto; width: 38px; padding: 12px 0; background: transparent; border: 1px solid #4A3236; border-radius: 8px; color: #C97; font-size: 21px; line-height: 1; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { cursor: pointer; }
  .ghost { padding: 11px 14px; background: transparent; border: 1px solid #2A2F38; border-radius: 8px; color: #A8B0BB; font-size: 16px; }
  .platebtn { padding: 11px 14px; background: transparent; border: 1px solid #2A3A46; border-radius: 8px; color: #6FB3D2; font-size: 16px; }
  .warmbtn { padding: 11px 14px; background: transparent; border: 1px solid #3A3020; border-radius: 8px; color: #C9A25A; font-size: 16px; }
  .undo { padding: 11px 14px; background: transparent; border: 1px solid #5A3A3A; border-radius: 8px; color: #E0A0A0; font-size: 16px; }
  .log { flex: 1; min-width: 150px; padding: 13px 0; background: #2A2F38; border: 1px solid #3A404B; border-radius: 8px; color: #E8E6DF; font-size: 17px; font-weight: 700; }
  .log.done { background: #1F3A2C; border-color: #2E9E63; color: #3FDD8C; }

  /* ---- Edit mode ---- */
  .editrow { background: #1C2027; border: 1px solid #2A2F38; border-radius: 10px; padding: 10px; margin-bottom: 9px; }
  .editrow .er1 { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .editrow input, .editrow select { font-size: 16px; font-weight: 600; padding: 9px 8px; }
  .er-name { flex: 1; min-width: 0; }
  .er-move { display: flex; flex-direction: column; gap: 3px; }
  .er-move button { width: 34px; padding: 4px 0; background: transparent; border: 1px solid #2A2F38; border-radius: 6px; color: #8A919C; font-size: 14px; line-height: 1; }
  .er-del { width: 40px; padding: 9px 0; background: transparent; border: 1px solid #4A3236; border-radius: 8px; color: #C97; font-size: 18px; }
  .er2 { display: flex; gap: 6px; align-items: center; }
  .er-scheme { flex: 1; min-width: 0; }
  .er-sets { width: 66px; text-align: center; }
  .er-lab { font-size: 12px; color: #6E7580; }
  .editactions { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
  .addex { padding: 12px 14px; background: transparent; border: 1px dashed #3A404B; border-radius: 8px; color: #A8B0BB; font-size: 16px; flex: 1; min-width: 150px; }
  .resetday { padding: 12px 14px; background: transparent; border: 1px solid #4A3236; border-radius: 8px; color: #E0A0A0; font-size: 15px; }
  .donebtn { padding: 12px 14px; background: #2E9E63; border: none; border-radius: 8px; color: #E8E6DF; font-size: 16px; font-weight: 800; flex: 1; min-width: 120px; }

  .panel { margin-top: 20px; background: #1C2027; border: 1px solid #F5A62355; border-radius: 12px; padding: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 19px; }
  .panel textarea { width: 100%; font-size: 17px; font-weight: 400; margin-bottom: 8px; font-family: inherit; }
  .panel .report { font-family: ui-monospace, Menlo, monospace; font-size: 14.5px; font-weight: 400; white-space: pre; }
  .big { width: 100%; padding: 14px 0; background: #F5A623; border: none; border-radius: 8px; color: #14161A; font-size: 17.5px; font-weight: 800; margin-bottom: 8px; }
  .big.green { background: #2E9E63; color: #E8E6DF; }
  .backup { margin-top: 16px; }
  .backup button { margin-right: 8px; }
  .foot { margin-top: 18px; font-size: 13.5px; color: #6E7580; text-align: center; }
  .hidden { display: none; }

  /* ---- Session (workout) timer ---- */
  #sessionBar { display: flex; align-items: center; gap: 12px; margin: 0 2px 14px; }
  .sessStart { flex: 1; padding: 14px 0; background: #F5A623; border: none; border-radius: 10px; color: #14161A; font-size: 18px; font-weight: 800; letter-spacing: .02em; }
  .sessStop { flex: 0 0 auto; padding: 12px 18px; background: transparent; border: 1px solid #5A3A3A; border-radius: 10px; color: #E0A0A0; font-size: 15px; font-weight: 700; }
  #sessClock { display: flex; align-items: center; gap: 9px; font-size: 26px; font-weight: 800; }
  #sessClock.hidden { display: none; }
  .sessDot { width: 11px; height: 11px; border-radius: 50%; background: #3FDD8C; box-shadow: 0 0 0 0 rgba(63,221,140,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63,221,140,.5);} 70% { box-shadow: 0 0 0 9px rgba(63,221,140,0);} 100% { box-shadow: 0 0 0 0 rgba(63,221,140,0);} }

  /* ---- Rest timer bar ---- */
  #timerBar { position: fixed; left: 0; right: 0; bottom: 0; background: #10202A; border-top: 1px solid #23485C;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); z-index: 50; }
  #timerBar.done { background: #14301F; border-top-color: #2E9E63; }
  .tbInner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .tbTime { font-family: ui-monospace, Menlo, monospace; font-size: 40px; font-weight: 800; letter-spacing: .02em; min-width: 118px; }
  .tbLabel { flex: 1; min-width: 0; font-size: 14px; color: #8FB6C9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #timerBar.done .tbLabel { color: #7FD8A6; }
  .tbBtn { padding: 12px 13px; background: transparent; border: 1px solid #2C5064; border-radius: 8px; color: #9FCBDE; font-size: 16px; font-weight: 700; }
  .tbBtn.stop { border-color: #5A3A3A; color: #E0A0A0; }
  .tbProg { height: 3px; background: #1B3543; border-radius: 2px; margin-top: 8px; overflow: hidden; max-width: 560px; margin-left: auto; margin-right: auto; }
  .tbFill { height: 100%; background: #F5A623; width: 100%; }
  #timerBar.done .tbFill { background: #3FDD8C; }

  /* ---- Plate calculator overlay ---- */
  #plateOv { position: fixed; inset: 0; background: rgba(6,8,10,.72); z-index: 80; display: flex; align-items: flex-end; }
  #plateOv.hidden { display: none; }
  .plateSheet { background: #171B21; border-top: 1px solid #2A3A46; border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; margin: 0 auto; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .plateSheet h3 { margin: 0 0 12px; font-size: 20px; }
  .plateSheet .prow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .plateSheet .prow label { font-size: 15px; color: #8A919C; width: 58px; }
  .plateSheet .ptarget { flex: 1; text-align: center; font-family: ui-monospace, Menlo, monospace; }
  .barsel { display: flex; gap: 6px; flex-wrap: wrap; }
  .barsel button { padding: 9px 12px; background: #14161A; border: 1px solid #2A2F38; border-radius: 8px; color: #A8B0BB; font-size: 15px; font-weight: 700; }
  .barsel button.on { background: #F5A623; border-color: #F5A623; color: #14161A; }
  .plateOut { background: #14161A; border: 1px solid #2A3A46; border-radius: 10px; padding: 14px; margin: 6px 0 14px; }
  .plateOut .big2 { font-size: 26px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; }
  .plateOut .sub { font-size: 14px; color: #8A919C; margin-top: 6px; }
  .plateChips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .plateChips span { padding: 6px 10px; border-radius: 20px; background: #22303A; color: #CFE6F0; font-size: 15px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .plateClose { width: 100%; padding: 13px 0; background: #2A2F38; border: 1px solid #3A404B; border-radius: 8px; color: #E8E6DF; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <div class="title">IRON LOG</div>
  <div class="subtitle">60-Day Strength &amp; Growth · shoulder-safe build</div>

  <div class="row" id="phaseRow"></div>
  <div class="phasesub" id="phaseSub"></div>
  <div class="days" id="dayRow"></div>

  <div id="sessionBar">
    <button id="sessBtn" class="sessStart" onclick="toggleSession()">Start workout</button>
    <div id="sessClock" class="hidden"><span class="sessDot"></span><span id="sessTime" class="mono">0:00</span></div>
  </div>

  <div class="titlerow">
    <h2 id="dayTitle"></h2>
    <button id="editToggle" class="editToggle" onclick="toggleEdit()">Edit day</button>
  </div>
  <div id="exList"></div>

  <div class="panel">
    <h3>Share progress with Claude</h3>
    <textarea id="notes" rows="2" placeholder="Optional notes — sleep, soreness, shoulder, anything off..."></textarea>
    <button class="big" onclick="buildReport()">Build weekly report</button>
    <textarea id="reportOut" class="report hidden" rows="12" readonly onclick="this.select()"></textarea>
    <button id="copyBtn" class="big hidden" onclick="copyReport()">Copy report</button>
  </div>

  <div class="backup">
    <button class="ghost" onclick="exportData()">Back up data</button>
    <button class="ghost" onclick="importData()">Restore data</button>
  </div>

  <div class="foot">Rule of the house: beat the book.<br>Suggested weight is a starting point &middot; &#9201; rests &middot; edit any day to fit your gym<br>Data lives in this browser &mdash; back it up now and then.</div>
</div>

<div id="timerBar" class="hidden">
  <div class="tbInner">
    <div class="tbTime" id="tbTime">2:00</div>
    <div class="tbLabel" id="tbLabel">Rest</div>
    <button class="tbBtn" onclick="addTime(30)">+30s</button>
    <button class="tbBtn stop" onclick="stopTimer()">Stop</button>
  </div>
  <div class="tbProg"><div class="tbFill" id="tbFill"></div></div>
</div>

<div id="plateOv" class="hidden">
  <div class="plateSheet">
    <h3>Plate math</h3>
    <div class="prow">
      <label>Target</label>
      <input id="pTarget" class="ptarget" inputmode="numeric" oninput="renderPlates()">
    </div>
    <div class="prow">
      <label>Bar</label>
      <div class="barsel" id="barSel"></div>
    </div>
    <div class="plateOut" id="plateOut"></div>
    <button class="plateClose" onclick="closePlates()">Close</button>
  </div>
</div>

<script>
// ---------- PROGRAM: [id, name, scheme, sets, restSeconds] ----------
const PROGRAM = {
  b1: { label: "Block 1 \u00b7 Strength", sub: "Weeks 1\u20134 \u00b7 heavy, 1\u20132 reps in reserve", days: [
    { name: "Chest", ex: [
      ["b1c1","Flat DB Press","5 \u00d7 4\u20136",5,120],
      ["b1c2","Incline DB Press","4 \u00d7 6\u20138",4,120],
      ["b1c3","Decline Barbell Press","3 \u00d7 6\u201310",3,120],
      ["b1c4","High-to-Low Cable Crossover","3 \u00d7 12\u201315",3,90],
      ["b1c5","Decline DB Fly","2 \u00d7 12\u201315",2,90]]},
    { name: "Legs & Glutes", ex: [
      ["b1l5","Bulgarian Split Squat","3 \u00d7 8\u201310/leg",3,120],
      ["b1l1","Leg Press","5 \u00d7 6\u20138",5,120],
      ["b1l2","Hack Squat","3 \u00d7 6\u20138",3,120],
      ["b1l3","Romanian Deadlift","4 \u00d7 6\u20138",4,120],
      ["b1l4","Glute Pressdown / Hip Thrust","3 \u00d7 8\u201310",3,90],
      ["b1l6","Calf Raise","4 \u00d7 10\u201312",4,90]]},
    { name: "Shoulders & Back", ex: [
      ["b1s1","Lat Pulldown / Pull-Up","4 \u00d7 5\u20138",4,120],
      ["b1s2","Seated DB Overhead Press","4 \u00d7 6\u20138",4,120],
      ["b1s3","Chest-Supported Row","4 \u00d7 6\u20138",4,120],
      ["b1s4","DB Lateral Raise","4 \u00d7 12\u201315",4,90],
      ["b1s5","Face Pull","3 \u00d7 15\u201320 (light, paused)",3,90]]},
    { name: "Arms", ex: [
      ["b1a1","Close-Grip Bench Press","4 \u00d7 5\u20138",4,120],
      ["b1a2","Barbell Curl","4 \u00d7 6\u20138",4,120],
      ["b1a3","Overhead Cable Extension","3 \u00d7 8\u201310",3,90],
      ["b1a4","Incline DB Curl","3 \u00d7 10\u201312",3,90],
      ["b1a5","Rope Pushdown","3 \u00d7 12\u201315",3,90]]},
    { name: "Core, Balance & Shoulder", ex: [
      ["b1x1","Hanging Leg Raise","4 \u00d7 10\u201315",4,90],
      ["b1x2","Weighted Cable Crunch","4 \u00d7 10\u201312",4,90],
      ["b1x3","Pallof Press","3 \u00d7 12/side",3,90],
      ["b1x4","Single-Leg RDL","3 \u00d7 10/side",3,90],
      ["b1x5","Cable External Rotation","3 \u00d7 15/side",3,90],
      ["b1x6","Farmer's Carry","4 \u00d7 40m (log lbs)",4,120]]},
  ]},
  b2: { label: "Block 2 \u00b7 Growth", sub: "Weeks 6\u20138 \u00b7 new exercises, more volume", days: [
    { name: "Chest", ex: [
      ["b2c1","Machine Incline Press","4 \u00d7 6\u20138",4,120],
      ["b2c2","Flat Machine / Smith Press","4 \u00d7 8\u201312",4,120],
      ["b2c3","Decline DB Press","3 \u00d7 10\u201312",3,90],
      ["b2c4","Pec-Deck","3 \u00d7 12\u201315",3,90],
      ["b2c5","DB Pullover","2 \u00d7 12\u201315",2,90]]},
    { name: "Legs & Glutes", ex: [
      ["b2l2","Bulgarian Split Squat","4 \u00d7 8\u201310/leg",4,120],
      ["b2l1","Hack Squat / Leg Press (high feet)","4 \u00d7 6\u20138",4,120],
      ["b2l3","Lying Leg Curl","3 \u00d7 10\u201312",3,90],
      ["b2l4","Machine Glute Kickback","3 \u00d7 12\u201315",3,90],
      ["b2l5","Hip Abduction","3 \u00d7 12\u201315",3,90],
      ["b2l6","Seated Calf Raise","4 \u00d7 12\u201315",4,90]]},
    { name: "Shoulders & Back", ex: [
      ["b2s1","Chest-Supported Row","4 \u00d7 8\u201310",4,120],
      ["b2s2","Machine Shoulder Press","4 \u00d7 8\u201310",4,120],
      ["b2s3","Neutral-Grip Pulldown","3 \u00d7 10\u201312",3,90],
      ["b2s4","Cable Lateral Raise","4 \u00d7 12\u201315",4,90],
      ["b2s5","Reverse Pec-Deck","3 \u00d7 12\u201315",3,90],
      ["b2s6","DB Shrug","3 \u00d7 10\u201312",3,90]]},
    { name: "Arms", ex: [
      ["b2a1","EZ-Bar Skullcrusher","4 \u00d7 8\u201312",4,120],
      ["b2a2","Preacher Curl","4 \u00d7 8\u201312",4,90],
      ["b2a3","Overhead Cable Extension","3 \u00d7 10\u201312",3,90],
      ["b2a4","Hammer Curl","3 \u00d7 10\u201312",3,90],
      ["b2a5","Cable Curl + Pushdown (superset)","3 \u00d7 12\u201315",3,90]]},
    { name: "Core, Balance & Shoulder", ex: [
      ["b2x1","Ab-Wheel Rollout","4 \u00d7 8\u201312",4,90],
      ["b2x2","Decline Weighted Sit-Up","3 \u00d7 10\u201312",3,90],
      ["b2x3","Side Plank Reach-Through","3 \u00d7 30s/side (log secs)",3,90],
      ["b2x4","Cossack Squat","3 \u00d7 8/side",3,90],
      ["b2x5","Band Pull-Apart + Ext. Rotation","3 \u00d7 15",3,90],
      ["b2x6","Suitcase Carry","3 \u00d7 40m/side (log lbs)",3,120]]},
  ]},
};

const KEY = "ironlog-v1";
const OVR = "ironlog-overrides";
let hist = {}, overrides = {};
try { hist = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { hist = {}; }
try { overrides = JSON.parse(localStorage.getItem(OVR) || "{}"); } catch (e) { overrides = {}; }
let phase = "b1", dayIdx = 0, editMode = false;

const $ = (id) => document.getElementById(id);
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const isWarm = (p) => p.length > 2 && p[2];
const workSets = (s) => s.filter(p => !isWarm(p));
const warmCount = (s) => s.filter(isWarm).length;
const setStr = (s) => s.map(p => (Number(p[0]) === 0 ? "BW" : p[0]) + "\u00d7" + p[1]).join(", ");
const bestSet = (s) => workSets(s).reduce((m, p) => Math.max(m, (+p[0] || 0) * (+p[1] || 0)), 0);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(hist)); } catch (e) { alert("Couldn't save \u2014 storage may be blocked or full."); } };
const saveOvr = () => { try { localStorage.setItem(OVR, JSON.stringify(overrides)); } catch (e) {} };
const esc = (t) => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const mmss = (s) => { s = Math.max(0, s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };

const progId = () => phase === "b2" ? "b2" : "b1";
const dayKey = () => progId() + "_" + dayIdx;
function effectiveList() {
  const k = dayKey();
  if (overrides[k]) return overrides[k];
  return PROGRAM[progId()].days[dayIdx].ex;
}
function effectiveDayName() { return PROGRAM[progId()].days[dayIdx].name; }
function incForDayName(name) { return name && name.indexOf("Legs") === 0 ? 10 : 5; }

function rawEx(id) {
  for (const k in overrides) { for (const e of overrides[k]) if (e[0] === id) return e; }
  for (const blk of Object.values(PROGRAM))
    for (const d of blk.days)
      for (const e of d.ex)
        if (e[0] === id) return e;
  return null;
}
function metaFor(id) {
  // returns {blk, day, name, scheme} honoring overrides
  for (const k in overrides) {
    const arr = overrides[k];
    for (const e of arr) if (e[0] === id) {
      const pid = k.split("_")[0], di = +k.split("_")[1];
      return { blk: PROGRAM[pid].label, day: PROGRAM[pid].days[di].name, name: e[1], scheme: e[2] };
    }
  }
  for (const bkey in PROGRAM) { const blk = PROGRAM[bkey];
    for (const d of blk.days) for (const e of d.ex) if (e[0] === id)
      return { blk: blk.label, day: d.name, name: e[1], scheme: e[2] };
  }
  return null;
}

// ---------- SUGGESTED WEIGHT ----------
function parseTopReps(scheme) {
  const x = String(scheme).split(/\u00d7|x/i);
  const repsPart = x.length > 1 ? x[1] : x[0];
  const nums = (repsPart.match(/\d+/g) || []).map(Number);
  if (!nums.length) return null;
  return Math.max.apply(null, nums);
}
function suggestWeight(id, scheme, dayName) {
  const h = hist[id]; if (!h || !h.length) return null;
  const prior = h.filter(e => e.d !== today());
  if (!prior.length) return null;
  const ws = workSets(prior[prior.length-1].s);
  if (!ws.length) return null;
  const base = ws.reduce((m,p)=>Math.max(m, +p[0]||0), 0);
  if (base <= 0) return null; // bodyweight
  const top = parseTopReps(scheme);
  if (!top) return { sug: base, up: false };
  const atBase = ws.filter(p => +p[0] === base);
  const minReps = atBase.reduce((m,p)=>Math.min(m, +p[1]||0), Infinity);
  const inc = incForDayName(dayName);
  if (minReps >= top) return { sug: base + inc, up: true };
  return { sug: base, up: false };
}

// ---------- REST TIMER ----------
let tEnd = 0, tTotal = 0, tTick = null, tLabel = "", audioCtx = null, doneRepeat = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function buzz(pattern) { if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }
function beep() {
  if (audioCtx) {
    try {
      const now = audioCtx.currentTime;
      const freqs = [988, 988, 988, 1319]; // three pulses + a higher final
      for (let i = 0; i < freqs.length; i++) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "square"; o.frequency.value = freqs[i];
        const t0 = now + i * 0.32, dur = (i === freqs.length-1) ? 0.5 : 0.24;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.6, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0); o.stop(t0 + dur + 0.02);
      }
    } catch (e) {}
  }
  buzz([500, 180, 500, 180, 700]);
}
function startTimer(secs, label) {
  initAudio();
  tTotal = secs; tEnd = Date.now() + secs * 1000; tLabel = label || "Rest";
  if (doneRepeat) { clearTimeout(doneRepeat); doneRepeat = null; }
  $("timerBar").classList.remove("hidden", "done");
  if (tTick) clearInterval(tTick);
  tTick = setInterval(tickTimer, 200);
  tickTimer();
}
function tickTimer() {
  const left = Math.round((tEnd - Date.now()) / 1000);
  $("tbTime").textContent = mmss(left);
  const pct = tTotal ? Math.max(0, Math.min(100, (left / tTotal) * 100)) : 0;
  $("tbFill").style.width = pct + "%";
  if (left > 0) {
    $("tbLabel").textContent = tLabel;
    $("timerBar").classList.remove("done");
  } else {
    if (!$("timerBar").classList.contains("done")) {
      $("timerBar").classList.add("done");
      $("tbLabel").textContent = "Rest complete \u2014 next set";
      $("tbTime").textContent = "0:00";
      $("tbFill").style.width = "100%";
      beep();
      doneRepeat = setTimeout(() => { if ($("timerBar").classList.contains("done")) { beep(); } }, 3000);
    }
    if (left < -25) stopTimer();
  }
}
function addTime(s) { if (tEnd) { tEnd += s * 1000; tTotal += s; if (doneRepeat){clearTimeout(doneRepeat);doneRepeat=null;} $("timerBar").classList.remove("done"); tickTimer(); } }
function stopTimer() {
  if (tTick) clearInterval(tTick);
  if (doneRepeat) { clearTimeout(doneRepeat); doneRepeat = null; }
  tTick = null; tEnd = 0;
  $("timerBar").classList.add("hidden");
  $("timerBar").classList.remove("done");
}
function restFor(id) {
  const e = rawEx(id);
  const base = e && e[4] ? e[4] : 90;
  return phase === "dl" ? Math.round(base * 0.75) : base;
}
function startRest(id) { const e = rawEx(id); startTimer(restFor(id), e ? e[1] : "Rest"); }

// ---------- SESSION TIMER ----------
let sessStart = 0, sessTick = null, lastSessionMin = 0;
try { const sv = localStorage.getItem("ironlog-session"); if (sv) sessStart = parseInt(sv,10) || 0; } catch (e) {}
try { const lm = localStorage.getItem("ironlog-lastmin"); if (lm) lastSessionMin = parseInt(lm,10) || 0; } catch (e) {}
function sessElapsed() { return sessStart ? Math.floor((Date.now() - sessStart) / 1000) : 0; }
function fmtDur(sec) {
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h ? (h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0")) : (m + ":" + String(s).padStart(2,"0"));
}
function renderSession() {
  const btn = $("sessBtn"), clock = $("sessClock"); if (!btn) return;
  if (sessStart) { btn.textContent = "Finish"; btn.className = "sessStop"; clock.classList.remove("hidden"); $("sessTime").textContent = fmtDur(sessElapsed()); }
  else { btn.textContent = "Start workout"; btn.className = "sessStart"; clock.classList.add("hidden"); }
}
function tickSession() { if (sessStart) $("sessTime").textContent = fmtDur(sessElapsed()); }
function setLastMin(m) { lastSessionMin = m; try { localStorage.setItem("ironlog-lastmin", String(m)); } catch (e) {} }
function toggleSession() {
  if (sessStart) {
    const mins = Math.round(sessElapsed()/60);
    sessStart = 0; try { localStorage.removeItem("ironlog-session"); } catch (e) {}
    if (sessTick) { clearInterval(sessTick); sessTick = null; }
    renderSession(); setLastMin(mins);
    if (mins >= 1) alert("Workout complete \u2014 " + fmtDur(mins*60) + " total. It'll be added to your next report.");
  } else {
    sessStart = Date.now(); try { localStorage.setItem("ironlog-session", String(sessStart)); } catch (e) {}
    initAudio();
    if (sessTick) clearInterval(sessTick);
    sessTick = setInterval(tickSession, 1000);
    renderSession();
  }
}

// ---------- RENDER ----------
function renderPhases() {
  $("phaseRow").innerHTML = [["b1","Block 1"],["dl","Deload"],["b2","Block 2"]].map(([k,l]) =>
    '<button class="phase ' + (phase===k?"on":"") + '" onclick="setPhase(\'' + k + '\')">' + l + '</button>').join("");
  $("phaseSub").textContent = phase === "dl"
    ? "Week 5 \u00b7 ~60% weights, 2\u20133 sets, stop 4+ reps from failure. Log it anyway."
    : (phase === "b2" ? PROGRAM.b2.sub : PROGRAM.b1.sub);
}
function setPhase(p) { phase = p; editMode = false; render(); }
function setDay(i) { dayIdx = i; editMode = false; render(); }

function render() {
  renderPhases();
  const block = phase === "b2" ? PROGRAM.b2 : PROGRAM.b1;
  $("dayRow").innerHTML = block.days.map((d, i) =>
    '<button class="day ' + (i===dayIdx?"on":"") + '" onclick="setDay(' + i + ')"><b>D' + (i+1) + '</b><span>' + d.name.split(",")[0].split(" &")[0] + '</span></button>').join("");
  $("dayTitle").textContent = "Day " + (dayIdx+1) + " \u2014 " + effectiveDayName();
  $("editToggle").textContent = editMode ? "Done" : "Edit day";
  $("editToggle").className = "editToggle" + (editMode ? " on" : "");
  if (editMode) renderEdit();
  else $("exList").innerHTML = effectiveList().map(e => cardHTML(e)).join("");
  renderSession();
}

function renderCard(id) {
  const el = $("card-" + id);
  if (el) el.outerHTML = cardHTML(rawEx(id));
}

function cardHTML(exArr) {
  const id = exArr[0], name = exArr[1], scheme = exArr[2], nsets = exArr[3];
  const rest = restFor(id);
  const dayName = effectiveDayName();
  const h = hist[id] || [];
  const todayEntry = h.find(e => e.d === today());
  const prior = h.filter(e => e.d !== today());
  const beatRef = prior[prior.length-1];
  const pr = todayEntry && beatRef && bestSet(todayEntry.s) > bestSet(beatRef.s);
  const sug = suggestWeight(id, scheme, dayName);

  let info = beatRef
    ? '<div class="last"><span class="beat">BEAT</span><span class="mono">' + setStr(workSets(beatRef.s)) + '</span><span class="dim">(' + fmtDate(beatRef.d) + ')</span>'
      + (sug ? '<span class="sugchip ' + (sug.up?"up":"hold") + '">' + (sug.up?"\u25b2 try ":"hold ") + sug.sug + '</span>' : '')
      + '</div>'
    : '<div class="last dim">First session \u2014 set your baseline' + (phase==="dl"?" at ~60%":"") + '.</div>';
  if (todayEntry) {
    const wc = warmCount(todayEntry.s);
    info += '<div class="last"><span class="today">TODAY</span><span class="mono">' + setStr(workSets(todayEntry.s)) + '</span>'
      + (wc ? '<span class="warmnote">+' + wc + ' warm-up</span>' : '')
      + (pr ? '<span class="pr">\u25b2 PR</span>' : '') + '</div>';
  }

  const prefill = (!todayEntry && sug) ? sug.sug : "";
  let rows = "";
  for (let i = 0; i < nsets; i++) rows += setRowHTML(id, i+1, false, prefill);

  const logBtn = todayEntry
    ? '<button class="log done" id="btn-' + id + '" onclick="logEx(\'' + id + '\')">Update log</button>'
    : '<button class="log" id="btn-' + id + '" onclick="logEx(\'' + id + '\')">Log exercise</button>';
  const undoBtn = todayEntry ? '<button class="undo" onclick="undoToday(\'' + id + '\')">\u21ba Undo today</button>' : "";

  return '<div class="card" id="card-' + id + '">' +
    '<div class="exhead"><div class="exname">' + esc(name) + '</div><div class="scheme">' + esc(scheme) + '</div></div>' +
    '<div class="resttag">Rest ' + mmss(rest) + ' between sets</div>' +
    info +
    '<div id="sets-' + id + '">' + rows + '</div>' +
    '<div class="btns">' +
      '<button class="warmbtn" onclick="addWarm(\'' + id + '\')">+ warm-up</button>' +
      '<button class="ghost" onclick="addSet(\'' + id + '\')">+ set</button>' +
      '<button class="platebtn" onclick="openPlates(\'' + id + '\')">\u2696 Plates</button>' +
      '<button class="ghost" onclick="startRest(\'' + id + '\')">\u23f1 Rest</button>' +
      undoBtn + logBtn +
    '</div></div>';
}

function setRowHTML(id, label, warm, prefill) {
  const cls = warm ? "setrow warm" : "setrow";
  const numCls = warm ? "setnum wlab" : "setnum";
  const lab = warm ? "W" : label;
  const val = (!warm && prefill !== undefined && prefill !== "" && prefill !== null) ? (' value="' + prefill + '" class="sugg"') : "";
  return '<div class="' + cls + '" data-warm="' + (warm ? "1" : "0") + '">' +
    '<span class="' + numCls + '">' + lab + '</span>' +
    '<input inputmode="decimal" placeholder="lbs/bw" data-k="w"' + val + ' onfocus="this.select()" oninput="this.classList.remove(\'sugg\')">' +
    '<span class="dim">\u00d7</span>' +
    '<input inputmode="numeric" placeholder="reps" data-k="r">' +
    '<button class="setrest" onclick="startRest(\'' + id + '\')" aria-label="Start rest">\u23f1</button>' +
    '<button class="setdel" onclick="deleteSet(this,\'' + id + '\')" aria-label="Delete set">\u00d7</button></div>';
}
function renumber(id) {
  let n = 0;
  document.querySelectorAll("#sets-" + id + " .setrow").forEach((r) => {
    const lab = r.querySelector(".setnum");
    if (r.getAttribute("data-warm") === "1") lab.textContent = "W";
    else { n++; lab.textContent = n; }
  });
}
function addSet(id) { $("sets-" + id).insertAdjacentHTML("beforeend", setRowHTML(id, 0, false, "")); renumber(id); }
function addWarm(id) { $("sets-" + id).insertAdjacentHTML("afterbegin", setRowHTML(id, 0, true, "")); renumber(id); }
function deleteSet(btn, id) { const row = btn.closest(".setrow"); if (row) row.parentNode.removeChild(row); renumber(id); }
function logEx(id) {
  const rows = document.querySelectorAll("#sets-" + id + " .setrow");
  const sets = [];
  rows.forEach((row) => {
    const wRaw = row.querySelector('input[data-k="w"]').value.trim();
    const w = wRaw === "" ? 0 : parseFloat(wRaw);
    const r = parseFloat(row.querySelector('input[data-k="r"]').value);
    if (!isNaN(w) && !isNaN(r) && r > 0) {
      if (row.getAttribute("data-warm") === "1") sets.push([w, r, 1]);
      else sets.push([w, r]);
    }
  });
  if (!workSets(sets).length) return;
  const arr = (hist[id] || []).filter(e => e.d !== today());
  arr.push({ d: today(), s: sets });
  hist[id] = arr.slice(-14);
  save();
  renderCard(id);
}
function undoToday(id) {
  if (!hist[id]) return;
  hist[id] = hist[id].filter(e => e.d !== today());
  if (!hist[id].length) delete hist[id];
  save();
  renderCard(id);
}

// ---------- EDIT DAY ----------
function toggleEdit() {
  editMode = !editMode;
  if (editMode) { const k = dayKey(); if (!overrides[k]) { overrides[k] = effectiveList().map(t => t.slice()); saveOvr(); } }
  render();
}
function renderEdit() {
  const k = dayKey();
  const list = overrides[k] || [];
  let html = "";
  list.forEach((e, idx) => {
    html += '<div class="editrow">' +
      '<div class="er1">' +
        '<div class="er-move"><button onclick="moveItem(' + idx + ',-1)">\u25b2</button><button onclick="moveItem(' + idx + ',1)">\u25bc</button></div>' +
        '<input class="er-name" value="' + esc(e[1]) + '" oninput="editField(' + idx + ',1,this.value)" placeholder="Exercise name">' +
        '<button class="er-del" onclick="deleteItem(' + idx + ')" aria-label="Remove">\u00d7</button>' +
      '</div>' +
      '<div class="er2">' +
        '<input class="er-scheme" value="' + esc(e[2]) + '" oninput="editField(' + idx + ',2,this.value)" placeholder="e.g. 4 \u00d7 6\u20138">' +
        '<input class="er-sets" inputmode="numeric" value="' + e[3] + '" oninput="editField(' + idx + ',3,this.value)" title="sets">' +
        '<select onchange="editField(' + idx + ',4,this.value)">' +
          '<option value="90"' + (e[4]==90?" selected":"") + '>rest 1:30</option>' +
          '<option value="120"' + (e[4]==120?" selected":"") + '>rest 2:00</option>' +
        '</select>' +
      '</div>' +
    '</div>';
  });
  html += '<div class="editactions">' +
    '<button class="addex" onclick="addItem()">+ Add exercise</button>' +
    '<button class="resetday" onclick="resetDay()">Reset day</button>' +
    '<button class="donebtn" onclick="toggleEdit()">Done editing</button>' +
    '</div>';
  $("exList").innerHTML = html;
}
function editField(idx, pos, val) {
  const k = dayKey(); if (!overrides[k] || !overrides[k][idx]) return;
  if (pos === 3) { const n = parseInt(val,10); overrides[k][idx][3] = (isNaN(n)||n<1) ? 1 : n; }
  else if (pos === 4) { overrides[k][idx][4] = parseInt(val,10) || 90; }
  else overrides[k][idx][pos] = val;
  saveOvr();
}
function moveItem(idx, dir) {
  const k = dayKey(); const a = overrides[k]; if (!a) return;
  const j = idx + dir; if (j < 0 || j >= a.length) return;
  const tmp = a[idx]; a[idx] = a[j]; a[j] = tmp;
  saveOvr(); renderEdit();
}
function deleteItem(idx) {
  const k = dayKey(); const a = overrides[k]; if (!a) return;
  if (!confirm("Remove \"" + a[idx][1] + "\" from this day? Its history is kept.")) return;
  a.splice(idx, 1); saveOvr(); renderEdit();
}
function addItem() {
  const k = dayKey(); if (!overrides[k]) overrides[k] = [];
  const rest = incForDayName(effectiveDayName()) === 10 ? 120 : 90;
  overrides[k].push(["u" + Date.now(), "New Exercise", "3 \u00d7 8\u201312", 3, rest]);
  saveOvr(); renderEdit();
}
function resetDay() {
  const k = dayKey();
  if (!confirm("Reset this day back to the original program? Your edits to the day layout are removed. Logged history is kept.")) return;
  delete overrides[k]; saveOvr(); editMode = false; render();
}

// ---------- PLATE CALCULATOR ----------
const BARS = [45, 35, 25, 15, 0];
const PLATES = [45, 35, 25, 10, 5, 2.5];
let plateBar = 45;
function openPlates(id) {
  let start = 45;
  if (id) {
    const e = rawEx(id);
    const sug = e ? suggestWeight(id, e[2], effectiveDayName()) : null;
    if (sug) start = sug.sug;
    else {
      const h = hist[id];
      if (h && h.length) { const ws = workSets(h[h.length-1].s); if (ws.length) start = ws.reduce((m,p)=>Math.max(m,+p[0]||0),0); }
    }
  }
  if (!start || start < 1) start = 45;
  $("pTarget").value = start;
  $("barSel").innerHTML = BARS.map(b =>
    '<button class="' + (b===plateBar?"on":"") + '" onclick="setBar(' + b + ')">' + (b===0?"None":b) + '</button>').join("");
  $("plateOv").classList.remove("hidden");
  renderPlates();
}
function setBar(b) { plateBar = b; $("barSel").querySelectorAll("button").forEach((btn,i)=>btn.className = BARS[i]===b?"on":""); renderPlates(); }
function renderPlates() {
  const target = parseFloat($("pTarget").value) || 0;
  const perSide = (target - plateBar) / 2;
  let out;
  if (plateBar === 0) {
    out = '<div class="big2">' + target + ' lb</div><div class="sub">Machine / dumbbell \u2014 no bar plates.</div>';
  } else if (perSide < 0) {
    out = '<div class="big2">\u2014</div><div class="sub">Target is below the ' + plateBar + ' lb bar.</div>';
  } else {
    let rem = perSide; const used = [];
    for (const p of PLATES) { while (rem >= p - 1e-9) { used.push(p); rem = Math.round((rem - p) * 100) / 100; } }
    const chips = used.length ? '<div class="plateChips">' + used.map(p => '<span>' + p + '</span>').join("") + '</div>' : '<div class="sub">Just the bar.</div>';
    let sub = 'Per side: ' + (used.length ? used.join(" + ") + " = " + perSide + " lb" : "empty") + ' \u00b7 bar ' + plateBar;
    if (rem > 0.01) sub += ' \u00b7 closest reachable, off by ~' + (rem*2) + ' lb';
    out = '<div class="big2">' + target + ' lb total</div><div class="sub">' + sub + '</div>' + chips;
  }
  $("plateOut").innerHTML = out;
}
function closePlates() { $("plateOv").classList.add("hidden"); }

// ---------- REPORT ----------
function buildReport() {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 8);
  const groups = {};
  for (const pair of Object.entries(hist)) {
    const id = pair[0], h = pair[1];
    if (!h.length) continue;
    const latest = h[h.length-1];
    if (new Date(latest.d + "T12:00:00") < cutoff) continue;
    const meta = metaFor(id); if (!meta) continue;
    const key = meta.blk + " \u2014 " + meta.day;
    const prev = h[h.length-2];
    let line = "\u2022 " + meta.name + " (" + meta.scheme + "): " + setStr(workSets(latest.s));
    if (prev) line += "  [prev: " + setStr(workSets(prev.s)) + "]";
    if (prev && bestSet(latest.s) > bestSet(prev.s)) line += "  \u25b2";
    (groups[key] = groups[key] || []).push(line);
  }
  let out = ["IRON LOG REPORT \u2014 " + fmtDate(today())];
  const keys = Object.keys(groups);
  if (!keys.length) out.push("", "(No sessions logged in the past 8 days.)");
  for (const k of keys) { out.push("", k); for (const l of groups[k]) out.push(l); }
  if (lastSessionMin >= 1) out.push("", "Session length: " + fmtDur(lastSessionMin*60));
  const n = $("notes").value.trim();
  if (n) out.push("", "Notes: " + n);
  out.push("", "How it felt / shoulder status: ");
  const ta = $("reportOut");
  ta.value = out.join("\n");
  ta.classList.remove("hidden");
  $("copyBtn").classList.remove("hidden");
  $("copyBtn").textContent = "Copy report"; $("copyBtn").classList.remove("green");
}
function copyReport() {
  const ta = $("reportOut");
  ta.select(); ta.setSelectionRange(0, 999999);
  const done = () => { const b = $("copyBtn"); b.textContent = "Copied \u2014 paste it to Claude"; b.classList.add("green"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done).catch(() => { document.execCommand("copy"); done(); });
  else { document.execCommand("copy"); done(); }
}

// ---------- BACKUP ----------
function exportData() {
  const blob = new Blob([JSON.stringify({ hist: hist, overrides: overrides })], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ironlog-backup-" + today() + ".json";
  a.click();
}
function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (data && data.hist) { hist = data.hist; overrides = data.overrides || {}; }
        else { hist = data; } // legacy backup (hist only)
        save(); saveOvr(); render(); alert("Data restored.");
      } catch (e) { alert("That file couldn't be read as a backup."); }
    };
    r.readAsText(f);
  };
  inp.click();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { if (tEnd) tickTimer(); if (sessStart) tickSession(); }
});
if (sessStart && !sessTick) sessTick = setInterval(tickSession, 1000);
render();
</script>
